; Pokemon NXT MMO client - this file contains NO database credentials.
[server]
; Use 127.0.0.1 for a server on this PC. For LAN play use the server PC's LAN IP.
host=127.0.0.1
port=7777
; Public internet play requires a trusted server certificate and tls=true.
tls=false

[display]
; 0 = automatic integer pixel scaling appropriate for your window (including 4K).
pixel_scale=0
; 0 = responsive automatic UI size. Otherwise 0.8 through 2.0.
ui_scale=0
start_maximized=true

[launcher]
; Optional absolute path to msedge.exe when Edge is installed in a custom location.
edge_path=
; Keep the app alive for this many seconds after its last window heartbeat.
idle_shutdown_seconds=90
