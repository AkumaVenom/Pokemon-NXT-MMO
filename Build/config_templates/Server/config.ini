; Pokemon NXT MMO - dedicated world server. Never distribute this file to players.
; All paths are relative to this Server folder. Restart after editing.
[network]
bind_ip = 0.0.0.0
port = 7777
; Direct TLS is optional for isolated LAN testing, REQUIRED for public deployment.
tls = false
; Run 2b - Configure Online Hosting.cmd before enabling TLS for internet players.
; The setup validates the certificate against this exact client join hostname/IP.
public_host =
certificate = certificates/server.crt
private_key = certificates/server.key
allow_insecure_lan = true
max_pending_connections = 64

[database]
; Run 2 - Configure MySQL.cmd to provision a separate database and local DB account.
backend = mysql
host = 127.0.0.1
port = 3306
database = pokemon_nxt_mmo
user = pokemon_nxt
password = CHANGE_ME_WITH_SETUP
; Empty uses the password above. This environment variable takes precedence when set.
password_environment = POKEMON_NXT_DB_PASSWORD
ssl_ca =
; SQLite is a deliberately explicit developer-only test backend, never an automatic fallback.
sqlite_path = data/development.sqlite3

[world]
name = Pokemon NXT MMO - Alpha World
max_players = 1000
tick_hz = 10
step_ms = 160
interest_radius = 28
; Walking progress is saved automatically every 5 seconds; important actions
; and logout save before completion. Existing deployed config values are kept.
save_interval_seconds = 5
encounter_chance = 0.09
max_owned_pokemon = 240
; Alpha exploration controls, not original story unlocks.
allow_alpha_atlas = true
allow_alpha_surf = true
registration_enabled = true
motd = Welcome to Pokemon NXT MMO. This is a private alpha: explore, catch, battle and trade.

[gameplay]
starting_money = 3000
starting_pokeballs = 20
starting_potions = 5
battle_turn_seconds = 45
trade_timeout_seconds = 180
invite_timeout_seconds = 30

[security]
auth_attempts_per_minute = 6
chat_messages_per_10_seconds = 5
max_packet_bytes = 8192
max_outbound_messages = 128
; Permit the dedicated local Windows client shell. Remote web origins are not accepted.
allowed_origin_pattern = ^http://(127\.0\.0\.1|localhost):[0-9]{1,5}$

[extensions]
directory = extensions
