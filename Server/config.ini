; Pokemon NXT MMO - dedicated world server. Never distribute this file to players.
; All paths are relative to this Server folder. Restart after editing.
[network]
bind_ip = 0.0.0.0
port = 7777
; Direct TLS is optional for isolated LAN testing, REQUIRED for public deployment.
tls = false
; Run 2b - Configure Online Hosting.cmd before enabling TLS for internet players.
; The setup validates the certificate against this exact client join hostname/IP.
public_host =
certificate = certificates/server.crt
private_key = certificates/server.key
allow_insecure_lan = true
max_pending_connections = 64

[database]
; Run 2 - Configure MySQL.cmd to provision a separate database and local DB account.
backend = mysql
host = 127.0.0.1
port = 3306
database = pokemon_nxt_mmo
user = pokemon_nxt
password = CHANGE_ME_WITH_SETUP
; Empty uses the password above. This environment variable takes precedence when set.
password_environment = POKEMON_NXT_DB_PASSWORD
ssl_ca =
; SQLite is a deliberately explicit developer-only test backend, never an automatic fallback.
sqlite_path = data/development.sqlite3

[world]
name = Pokemon NXT MMO - Adventure World
max_players = 1000
tick_hz = 10
step_ms = 160
interest_radius = 28
; Walking progress is saved automatically every 5 seconds; important actions
; and logout save before completion. Existing deployed config values are kept.
save_interval_seconds = 5
encounter_chance = 0.09
max_owned_pokemon = 240
; Administrator exploration overrides. Keep false for adventure badge unlocks.
allow_alpha_atlas = false
allow_alpha_surf = false
registration_enabled = true
motd = Welcome to Pokemon NXT MMO. Explore, challenge Gyms and visit Nurse Joy to restore your party.

[gameplay]
starting_money = 3000
starting_pokeballs = 20
starting_potions = 5
battle_turn_seconds = 45
trade_timeout_seconds = 180
invite_timeout_seconds = 30

[security]
auth_attempts_per_minute = 6
chat_messages_per_10_seconds = 5
max_packet_bytes = 8192
max_outbound_messages = 128
; Permit the dedicated local Windows client shell. Remote web origins are not accepted.
allowed_origin_pattern = ^http://(127\.0\.0\.1|localhost):[0-9]{1,5}$

[extensions]
directory = extensions

; Optional local administrative console. Defaults also apply to older configs
; without this section. No network admin listener or player commands exist.
; Edit these fields, then run reloadconfig and confirm its token in the console.
; Changes outside [console] and world.registration_enabled require a restart.
[console]
enabled = true
allow_developer_commands = false
; Comma-separated canonical command names or aliases; empty enables all normal commands.
disabled_commands =
confirmation_seconds = 60

[autonomous_trainers]
; Persistent autonomous population. Bots roam level-appropriate outdoor/cave encounter maps inside their home region.
population = 2000
; Bounded elapsed-time/offline work per competitive simulation pass.
simulation_batch = 24
simulation_interval_seconds = 8
; Maximum replicated autonomous trainers per observing client/map.
visible_per_map = 8
; Red/Leaf field actors use the same tile cadence/interpolation contract as players.
field_step_ms = 160
field_persist_seconds = 2
field_battle_display_seconds = 2.8
field_wild_cooldown_seconds = 7
field_wild_step_chance = 0.22
field_wild_battles_per_tick = 2
; Share of elapsed-time actions spent on real wild Battle-engine training when possible.
offline_wild_activity_share = 0.58
; Regional travel: bots teleport between suitable routes/caves/wild areas, never interiors.
travel_min_seconds = 180
travel_max_seconds = 540
; Repeated wild losses force a retreat to a safer map.
travel_loss_retreats = 2
; Maximum ordinary encounter pressure above the current core-party level.
travel_safe_level_margin = 4
; Bots advance once they have outgrown a map and proven several wild wins there.
travel_progress_level_margin = 4
travel_map_win_target = 4
; Stability/hysteresis: normal travel cannot immediately re-trigger after arrival.
travel_min_dwell_seconds = 240
; Loss retreats are faster than routine travel, but still cannot blink between maps.
travel_retreat_dwell_seconds = 60
; Ordinary travel preserves a persistent resident floor on each occupied training map.
map_resident_floor = 6
; At most one visible trainer can leave an observed map during this interval.
active_map_departure_seconds = 90
; Newly materialized trainers are authoritatively scattered across encounter terrain.
materialized_spacing_tiles = 6
; Visible bots keep a local roaming territory so crowds do not reconverge on one grass patch.
materialized_roam_radius_tiles = 9
